DEFAULT android
TIMEOUT 30

LABEL android
    MENU LABEL Android 17 - Firefly-RK3288 (SD bring-up)
    LINUX /boot/zImage
    INITRD /boot/ramdisk.img
    FDT /boot/rk3288-firefly-android.dtb
    APPEND console=ttyS2,115200n8 console=tty1 loglevel=4 androidboot.hardware=fireflyrk3288 androidboot.boot_devices=ff0c0000.mmc androidboot.selinux=permissive androidboot.verifiedbootstate=orange androidboot.flash.locked=0 androidboot.serialno=${serial#} firmware_class.path=/vendor/firmware
